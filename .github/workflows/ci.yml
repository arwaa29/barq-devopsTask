name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create environment files
        run: |
          cp .env.example .env
          cat > config/app.env << 'EOF'
          DATABASE_URL=postgresql://barq_app:BarqLabOnly_7qN2vK8c@postgres:5432/barq_tasks
          REDIS_URL=redis://redis:6379/0
          EOF

      - name: Validate Compose syntax
        run: docker compose -p barq-assessment config

      - name: Build images
        run: docker compose -p barq-assessment build

      - name: Start environment
        run: docker compose -p barq-assessment up -d

      - name: Wait for readiness and run validation
        run: python3 validate.py

      - name: Show logs on failure
        if: failure()
        run: docker compose -p barq-assessment logs --no-color

      - name: Tear down
        if: always()
        run: docker compose -p barq-assessment down